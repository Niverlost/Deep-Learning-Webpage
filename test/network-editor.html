<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepViz Pro - 网络结构编辑器</title>
    <link rel="stylesheet" href="css/editor-style.css">
</head>
<body>
    <div class="editor-container">
        <!-- 顶部工具栏 -->
        <header class="editor-header">
            <div class="header-left">
                <h1 class="editor-title">🧠 DeepViz Editor</h1>
                <span class="editor-badge">v3.0 Pro</span>
                <div class="mode-indicator" id="mode-indicator">
                    <span class="mode-badge view-mode" id="view-mode-btn">查看模式</span>
                    <span class="mode-badge edit-mode active" id="edit-mode-btn">编辑模式</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="toolbar-group">
                    <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v6h6"></path>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                        </svg>
                    </button>
                    <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 7v6h-6"></path>
                            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
                        </svg>
                    </button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="toolbar-group connection-tools" id="connection-tools">
                    <button class="tool-btn active" id="btn-line-straight" title="直线连接">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="19" x2="19" y2="5"></line>
                        </svg>
                    </button>
                    <button class="tool-btn" id="btn-line-orthogonal" title="折线连接">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="5 19 5 12 19 12"></polyline>
                        </svg>
                    </button>
                    <button class="tool-btn" id="btn-line-curve" title="曲线连接">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 19 Q12 5 19 19"></path>
                        </svg>
                    </button>
                    <button class="tool-btn" id="btn-arrow-style" title="箭头样式切换">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="toolbar-divider"></div>
                <button class="btn btn-secondary" id="btn-import" title="导入网络结构">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    导入
                </button>
                <button class="btn btn-secondary" id="btn-export" title="导出网络结构">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    导出
                </button>
                <button class="btn btn-ghost" id="btn-clear" title="清空画布">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    清空
                </button>
                <label class="toggle-label" id="mode-toggle-container">
                    <span class="toggle-text">查看</span>
                    <input type="checkbox" id="toggle-edit-mode" checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">编辑</span>
                </label>
            </div>
        </header>

        <div class="editor-main">
            <!-- 左侧模块库 -->
            <aside class="module-library">
                <div class="library-tabs">
                    <button class="library-tab active" data-tab="modules">📦 模块库</button>
                    <button class="library-tab" data-tab="custom">⚙️ 自定义</button>
                </div>
                
                <!-- 模块库面板 -->
                <div class="library-panel active" id="modules-panel">
                    <div class="module-categories">
                        <button class="category-btn active" data-category="all">全部</button>
                        <button class="category-btn" data-category="input">输入</button>
                        <button class="category-btn" data-category="conv">卷积</button>
                        <button class="category-btn" data-category="linear">线性</button>
                        <button class="category-btn" data-category="pool">池化</button>
                        <button class="category-btn" data-category="attention">注意力</button>
                        <button class="category-btn" data-category="norm">归一化</button>
                        <button class="category-btn" data-category="activation">激活</button>
                        <button class="category-btn" data-category="recurrent">循环</button>
                        <button class="category-btn" data-category="transform">变换</button>
                        <button class="category-btn" data-category="combine">合并</button>
                        <button class="category-btn" data-category="dropout">Dropout</button>
                        <button class="category-btn" data-category="output">输出</button>
                    </div>
                    <div class="modules-list" id="modules-list">
                        <!-- 模块将动态生成 -->
                    </div>
                </div>
                
                <!-- 自定义模块面板 -->
                <div class="library-panel" id="custom-panel">
                    <div class="custom-module-actions">
                        <button class="btn btn-primary btn-sm" id="btn-create-module">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            创建自定义模块
                        </button>
                    </div>
                    <div class="custom-modules-list" id="custom-modules-list">
                        <!-- 自定义模块列表 -->
                    </div>
                </div>
            </aside>

            <!-- 中间画布区域 -->
            <main class="canvas-area">
                <div class="canvas-toolbar">
                    <div class="toolbar-group">
                        <button class="tool-btn active" id="btn-select" title="选择模式 (V)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                            </svg>
                        </button>
                        <button class="tool-btn" id="btn-pan" title="平移模式 (H)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                                <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
                                <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                                <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group">
                        <button class="tool-btn" id="btn-zoom-in" title="放大 (Ctrl++/Cmd++)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </button>
                        <button class="tool-btn" id="btn-zoom-out" title="缩小 (Ctrl+-/Cmd+-)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </button>
                        <button class="tool-btn" id="btn-fit" title="适应画布 (Ctrl+0/Cmd+0)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                            </svg>
                        </button>
                    </div>
                    <span class="zoom-level" id="zoom-level">100%</span>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group grid-tools">
                        <button class="tool-btn" id="btn-grid" title="显示/隐藏网格">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="3" y1="15" x2="21" y2="15"></line>
                                <line x1="9" y1="3" x2="9" y2="21"></line>
                                <line x1="15" y1="3" x2="15" y2="21"></line>
                            </svg>
                        </button>
                        <button class="tool-btn active" id="btn-snap" title="网格吸附">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M12 2v4"></path>
                                <path d="M12 18v4"></path>
                                <path d="M2 12h4"></path>
                                <path d="M18 12h4"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="selection-info" id="selection-info"></div>
                </div>
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <svg class="network-canvas" id="network-canvas">
                        <defs>
                            <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse" class="grid-pattern">
                                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-color)" stroke-width="0.5" opacity="0.3"/>
                            </pattern>
                            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent-primary)"/>
                            </marker>
                            <marker id="arrowhead-selected" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent-yellow)"/>
                            </marker>
                            <marker id="arrowhead-none" markerWidth="0" markerHeight="0">
                            </marker>
                        </defs>
                        <rect class="grid-background" width="100%" height="100%" fill="url(#grid-pattern)"/>
                        <g id="guides-layer"></g>
                        <g id="connections-layer"></g>
                        <g id="modules-layer"></g>
                        <g id="selection-layer"></g>
                        <g id="interaction-layer"></g>
                    </svg>
                </div>
            </main>

            <!-- 右侧属性面板 -->
            <aside class="properties-panel">
                <h2 class="panel-title">📋 属性面板</h2>
                <div class="panel-content" id="panel-content">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="9"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                        <p>选择一个模块来编辑其属性</p>
                        <p class="empty-hint">提示：拖拽模块到画布开始，按住Shift多选</p>
                    </div>
                </div>
                
                <!-- 快捷键提示 -->
                <div class="shortcuts-panel">
                    <h3 class="shortcuts-title">⌨️ 快捷键</h3>
                    <div class="shortcuts-list">
                        <div class="shortcut-item"><kbd>Ctrl+Z</kbd><span>撤销</span></div>
                        <div class="shortcut-item"><kbd>Ctrl+Y</kbd><span>重做</span></div>
                        <div class="shortcut-item"><kbd>Delete</kbd><span>删除</span></div>
                        <div class="shortcut-item"><kbd>Ctrl+A</kbd><span>全选</span></div>
                        <div class="shortcut-item"><kbd>Ctrl+D</kbd><span>复制</span></div>
                        <div class="shortcut-item"><kbd>Ctrl+C</kbd><span>复制</span></div>
                        <div class="shortcut-item"><kbd>Ctrl+V</kbd><span>粘贴</span></div>
                        <div class="shortcut-item"><kbd>Escape</kbd><span>取消选择</span></div>
                        <div class="shortcut-item"><kbd>V</kbd><span>选择模式</span></div>
                        <div class="shortcut-item"><kbd>H</kbd><span>平移模式</span></div>
                        <div class="shortcut-item"><kbd>Space</kbd><span>临时平移</span></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 导入模态框 -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-import-modal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">📥 导入网络结构</h2>
            <div class="import-options">
                <label class="import-option">
                    <input type="radio" name="import-type" value="json" checked>
                    <span>JSON 格式</span>
                </label>
                <label class="import-option">
                    <input type="radio" name="import-type" value="file">
                    <span>从文件导入</span>
                </label>
            </div>
            <textarea id="import-data" placeholder="粘贴 JSON 数据到这里..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="cancel-import">取消</button>
                <button class="btn btn-primary" id="confirm-import">导入</button>
            </div>
        </div>
    </div>

    <!-- 导出模态框 -->
    <div class="modal-overlay" id="export-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-export-modal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">📤 导出网络结构</h2>
            <div class="export-options">
                <label class="export-option">
                    <input type="radio" name="export-type" value="json" checked>
                    <span>JSON 格式</span>
                </label>
                <label class="export-option">
                    <input type="radio" name="export-type" value="png">
                    <span>PNG 图片</span>
                </label>
            </div>
            <textarea id="export-data" readonly></textarea>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="close-export">关闭</button>
                <button class="btn btn-secondary" id="copy-export">复制</button>
                <button class="btn btn-primary" id="download-export">下载</button>
            </div>
        </div>
    </div>

    <!-- 创建自定义模块模态框 -->
    <div class="modal-overlay" id="create-module-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-create-modal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">⚙️ 创建自定义模块</h2>
            <div class="form-group">
                <label class="form-label">模块名称</label>
                <input type="text" class="form-input" id="custom-module-name" placeholder="例如：MyCustomLayer">
            </div>
            <div class="form-group">
                <label class="form-label">显示图标 (Emoji)</label>
                <input type="text" class="form-input" id="custom-module-icon" placeholder="例如：📦">
            </div>
            <div class="form-group">
                <label class="form-label">描述</label>
                <input type="text" class="form-input" id="custom-module-desc" placeholder="简要描述模块的功能">
            </div>
            <div class="form-group">
                <label class="form-label">属性配置 (JSON格式)</label>
                <textarea class="form-input" id="custom-module-props" placeholder='[{"name": "units", "type": "number", "default": 128}, {"name": "activation", "type": "string", "default": "relu"}]'></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="cancel-create">取消</button>
                <button class="btn btn-primary" id="confirm-create">创建模块</button>
            </div>
        </div>
    </div>

    <!-- 确认删除对话框 -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content modal-sm">
            <h2 class="modal-title">⚠️ 确认删除</h2>
            <p class="confirm-message" id="confirm-message">确定要删除选中的模块吗？</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="cancel-confirm">取消</button>
                <button class="btn btn-danger" id="confirm-delete">删除</button>
            </div>
        </div>
    </div>

    <script src="js/editor.js"></script>
</body>
</html>
